user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # gzip compression
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript 
             application/json application/javascript application/xml+rss 
             application/rss+xml font/truetype font/opentype 
             application/vnd.ms-fontobject image/svg+xml;

  # Upstream definition for gRPC backends (least_conn load balancing)
  upstream grpc_backends {
    least_conn;
    server backend1:50051 max_fails=3 fail_timeout=10s;
    server backend2:50051 max_fails=3 fail_timeout=10s;
  }

  # HTTP bridge upstream (NDJSON/JSON over HTTP/1.1)
  upstream http_bridge_backends {
    least_conn;
    server backend1:8000 max_fails=3 fail_timeout=10s;
    server backend2:8000 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # HTTP bridge endpoints under /grpc/metrics.MetricsService/*
    # Rewrite to backend HTTP bridge paths without the /grpc prefix
    location ~ ^/grpc/metrics\.MetricsService/(StreamMetrics|ListAgents)$ {
      # CORS preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers Authorization,Content-Type;
        add_header Access-Control-Allow-Methods POST,OPTIONS;
        return 204;
      }

      # Forward to HTTP bridge, mapping /grpc/metrics.MetricsService/<method>
      # to /metrics.MetricsService/<method>
      proxy_pass http://http_bridge_backends/metrics.MetricsService/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Headers Authorization,Content-Type;
      add_header Access-Control-Allow-Methods POST,OPTIONS;
    }

    # gRPC endpoint: forward to backends with HTTP/2
    location /grpc {
      # Required for gRPC with Nginx
      grpc_pass grpc://grpc_backends;
      
      # Connection timeout and buffering
      grpc_read_timeout 300s;
      grpc_send_timeout 300s;
      grpc_connect_timeout 10s;
      
      # Headers required for gRPC
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Error handling
      error_page 502 = /grpc_error;
    }

    location = /grpc_error {
      return 502 '{"error": "gRPC backend unavailable"}';
      add_header Content-Type application/json;
    }

    # API health check (simple check)
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # Frontend SPA: support history API
    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
